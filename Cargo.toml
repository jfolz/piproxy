[package]
name = "piproxy"
version = "0.1.7"
edition = "2021"

[dependencies]
async-trait = "0.1"
blake2 = "0.10"
bstr = { version = "1.12", default-features = false }
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
const-hex = "1.14"
http = "1.3"
libc = "0.2"
log = { version = "0.4", features = ["serde"] }
once_cell = "1.21"
parse-size = "1.1"
paste = "1.0"
pingora = { version = "0.4", features = ["proxy", "cache"] }
procfs = "0.17"
prometheus = "0.14"
rmp-serde = "1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_yaml = "0.9"
systemd-journal-logger = "2.2"
timeout-readwrite = "0.4"
tokio = { version = "1", features = ["rt", "fs", "time"] }

[profile.profiling]
inherits = "release"
debug = true

[profile.prod]
inherits = "release"
strip = true         # Automatically strip symbols from the binary.
lto = true           # Enable LTO
codegen-units = 1    # Can enable additional optimizations
